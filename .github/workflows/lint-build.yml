name: Lint & build
on:
  workflow_dispatch:
  push:
    tags:
      - v*
    branches: [main]
  pull_request:
    branches: [main]

env:
  CACHE_KEY: "hugo-hinode-template"
  CACHE_PATH_DEBIAN: "/tmp/hugo_cache_runner"
  CACHE_PATH_WIN: '~\AppData\Local\hugo_cache'
  CACHE_PATH_MAC: "/Users/runner/Library/Caches/hugo_cache"

jobs:
  # lint:
  #   runs-on: ubuntu-latest

  #   steps:
  #     - name: Check out repository
  #       uses: actions/checkout@v6

  #     - name: Setup pnpm
  #       uses: pnpm/action-setup@v4
  #       with:
  #         version: 10.33.2 # 👈 Explicitly uses my pnpm version
  #     - name: Set up Node.js
  #       uses: actions/setup-node@v6
  #       with:
  #         node-version: lts/*
  #         cache: "pnpm"
  #         cache-dependency-path: "**/pnpm-lock.yaml"

  #     - name: Install dependencies
  #       run: pnpm install --frozen-lockfile # 👈 Faster, deterministic, and safe across platforms

  #     - name: Lint scripts sources
  #       run: pnpm run lint # 👈 need setting up eslint

  build:
    # Note: Linting is currently disabled because it is not critical
    # in Hugo for content update and theme customization.
    # needs: lint

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        node-version: [22.x, 24.x]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ">1.0.0"

      # 1. WAJIB: Instal aplikasinya dulu di komputer ini
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install Dart Sass
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo snap install dart-sass
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install sass/sass/sass
          elif [ "$RUNNER_OS" == "Windows" ]; then
            choco install sass
          fi
        shell: bash

      - name: Perform clean install of pnpm dependencies
        run: pnpm install --frozen-lockfile # 👈 pnpm safely ignores cross-platform optional deps automatically!
        shell: bash

      # Cache Hugo cachedir and resourcedir (configured in config/ci/hugo.toml) for each OS
      # No additional cache invalidation is needed, Hugo uses checksums itself
      - name: Use Hugo cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && env.CACHE_PATH_WIN || runner.os == 'macOS' && env.CACHE_PATH_MAC || env.CACHE_PATH_DEBIAN }}
          key: ${{ runner.os }}-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-${{ env.CACHE_KEY }}

      - name: Build main site
        run: npm run build:cache
