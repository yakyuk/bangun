name: Update Hugo dependencies
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # run daily at 03:00 AM

permissions:
  contents: write
  pull-requests: write

jobs:
  update-mod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      # [26/AUG/23] Adjusted from npm ci to prevent EBADPLATFORM error due to fsevents
      - name: Install pnpm
        run: pnpm i

      - name: Update Hugo module dependencies
        id: mod-updates
        run: |
          # Disable immediate exit on error to capture the output properly
          set +e
          MOD_OUTPUT=$(pnpm run update-modules 2>&1)
          EXIT_CODE=$?
          set -e

          # Ensure the command's full output is printed to the GitHub Actions log
          echo "--- Hugo Module Update Output ---"
          echo "$MOD_OUTPUT"
          echo "--------------------------------"

          # Explicitly fail the step if the original command failed
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Error: pnpm run update-modules failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

          # Process outputs if successful
          MOD_UPDATES=$(echo "$MOD_OUTPUT" | grep '^go: upgraded' | sed 's/go: / - /' | sort -u)
          echo 'MOD_UPDATES<<EOF' >> $GITHUB_OUTPUT
          echo "$MOD_UPDATES" >> "$GITHUB_OUTPUT"
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: gethinode/create-pull-request@v7
        with:
          token: ${{ secrets.HUGO_MOD_PR }}
          commit-message: "fix: update Hugo module dependencies"
          committer: GitHub <noreply@github.com>
          branch: hugo-mod-dependencies
          delete-branch: true
          title: "Update Hugo module dependencies"
          body: |
            This PR is auto-generated by [create-pull-request][1].

            Changes to go.mod:

            ${{ steps.mod-updates.outputs.MOD_UPDATES }}

            [1]: https://github.com/peter-evans/create-pull-request
          labels: dependencies
          add-paths: |
            go.mod
            go.sum
          # add **/go.mod **/go.sum if your repository contains any modules in a subfolder
